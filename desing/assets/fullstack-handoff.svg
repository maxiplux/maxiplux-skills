<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title description">
<title id="title">One feature. Three kinds of decisions. One contract.</title><desc id="description">UI UX owns the task and recovery states. AI work owns interpretation and evaluation. Architecture owns contracts, boundaries and persistence. They share a versioned API and acceptance criteria. The example separates draft extraction from invoice creation and verifies one complete journey.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#132f55}.title{font-size:36px;font-weight:750}.heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.label{font-size:16px;font-weight:700;letter-spacing:1.1px}.white{fill:#ffffff}.mono{font-family:Consolas,monospace;font-size:20px}.note{font-size:20px;font-weight:600}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#245bd6"/></marker></defs>
<rect x="0" y="0" width="1400" height="940" rx="22" fill="#f8fbff" stroke="#c2d3ed" stroke-width="2"/><text x="42" y="62" class="title">One feature. Three kinds of decisions. One contract.</text><text x="42" y="104" class="body">Worked example: paste invoice text → extract → correct the draft → create the invoice.</text><rect x="42" y="142" width="1316" height="103" rx="14" fill="#132f55" stroke="#132f55" stroke-width="2"/><text x="64" y="180" class="label white">AGREE FIRST</text><text x="64" y="217" class="body white">Input + output DTOs · error types · authorization · draft-versus-save behavior · acceptance cases</text><rect x="42" y="290" width="412" height="360" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="64" y="321" class="label">01 · UI / UX &amp; DESIGN</text><text x="64" y="358" class="heading">Make the task usable</text><text x="64" y="395" class="body">Lead: Impeccable for the app</text><text x="64" y="423" class="body">Review: Web Design Guidelines</text><text x="64" y="451" class="body"></text><text x="64" y="479" class="body">Text input → progress → editable draft</text><text x="64" y="507" class="body">Keep input through recoverable errors</text><text x="64" y="535" class="body">Label fields, actions and status</text><text x="64" y="563" class="body">Check keyboard + narrow screens</text><rect x="494" y="290" width="412" height="360" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="516" y="321" class="label">02 · AI AGENTS</text><text x="516" y="358" class="heading">Bound model behavior</text><text x="516" y="395" class="body">Guide: spring-boot-ai</text><text x="516" y="423" class="body">Choose a fixed workflow first</text><text x="516" y="451" class="body"></text><text x="516" y="479" class="body">Prompt → model → typed draft</text><text x="516" y="507" class="body">Check missing and invalid fields</text><text x="516" y="535" class="body">Limit retries, time and tool access</text><text x="516" y="563" class="body">Evaluate output with known cases</text><rect x="946" y="290" width="412" height="360" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="968" y="321" class="label">03 · SOFTWARE ARCHITECTURE</text><text x="968" y="358" class="heading">Keep ownership clear</text><text x="968" y="395" class="body">Guide: spring-boot-vsa</text><text x="968" y="423" class="body">Angular: angular-vertical-slice</text><text x="968" y="451" class="body"></text><text x="968" y="479" class="body">Controller → handler → persistence</text><text x="968" y="507" class="body">Keep extraction separate from saving</text><text x="968" y="535" class="body">Preserve DTO and error contracts</text><text x="968" y="563" class="body">Protect writes with a short transaction</text><path d="M248 246 V278" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 246 V278" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1150 246 V278" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="692" width="1316" height="195" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="64" y="733" class="heading">INTEGRATION CHECK · THE SAME DATA MUST WORK ACROSS ALL THREE</text><text x="64" y="773" class="body">A missing currency becomes a clear correction, not an invented value or a broken form.</text><text x="64" y="801" class="body">A model timeout preserves the text; a rejected save explains the field or permission problem.</text><text x="64" y="829" class="body">A successful extraction creates a draft. Only the explicit save action creates an invoice.</text><text x="64" y="857" class="body">Review the diff, run focused checks and record which provider/browser paths were actually exercised.</text>
</svg>
