<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" role="img" aria-labelledby="title description">
<title id="title">Trace the request, the data change and the failure.</title><desc id="description">A save request passes through authentication and authorization, a thin controller, a feature handler and persistence. A short transaction protects the database write. AI extraction is a separate operation outside that transaction. Controller and handler errors reach shared advice; security-layer failures use the security error path. DTOs return to the UI.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#132f55}.title{font-size:36px;font-weight:750}.heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.label{font-size:16px;font-weight:700;letter-spacing:1.1px}.white{fill:#ffffff}.mono{font-family:Consolas,monospace;font-size:20px}.note{font-size:20px;font-weight:600}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#245bd6"/></marker></defs>
<rect x="0" y="0" width="1400" height="1110" rx="22" fill="#f8fbff" stroke="#c2d3ed" stroke-width="2"/><text x="42" y="62" class="title">Trace the request, the data change and the failure.</text><text x="42" y="104" class="body">Example: the user reviews an extracted draft, then explicitly creates the invoice.</text><text x="42" y="160" class="label">SAVE REQUEST · POST /invoices</text><rect x="42" y="185" width="286" height="239" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="64" y="216" class="label">1 · SECURITY</text><text x="64" y="253" class="heading">Who may act?</text><text x="64" y="290" class="body">Authenticate caller</text><text x="64" y="318" class="body">Authorize operation</text><text x="64" y="346" class="body">Scope to the tenant</text><text x="64" y="374" class="body">Do not trust a UI guard</text><rect x="370" y="185" width="286" height="239" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="392" y="216" class="label">2 · API</text><text x="392" y="253" class="heading">Thin controller</text><text x="392" y="290" class="body">Validate request shape</text><text x="392" y="318" class="body">Accept a request record</text><text x="392" y="346" class="body">Call the use-case handler</text><text x="392" y="374" class="body">Map status + response</text><rect x="698" y="185" width="318" height="239" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="720" y="216" class="label">3 · FEATURE</text><text x="720" y="253" class="heading">CreateInvoiceHandler</text><text x="720" y="290" class="body">Enforce business rules</text><text x="720" y="318" class="body">Own the use case</text><text x="720" y="346" class="body">Define the transaction</text><text x="720" y="374" class="body">Avoid duplicate writes</text><rect x="1058" y="185" width="300" height="239" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="1080" y="216" class="label">4 · PERSISTENCE</text><text x="1080" y="253" class="heading">Repository + DB</text><text x="1080" y="290" class="body">Bound database queries</text><text x="1080" y="318" class="body">Apply constraints</text><text x="1080" y="346" class="body">Use schema migrations</text><text x="1080" y="374" class="body">Persist feature-owned data</text><path d="M329 304 H358" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M657 304 H686" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1017 304 H1046" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><rect x="698" y="444" width="660" height="55" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="718" y="479" class="note">SHORT DB TRANSACTION · keep required writes atomic</text><rect x="42" y="533" width="1316" height="139" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="64" y="569" class="label">AI EXTRACTION IS A SEPARATE USE CASE</text><text x="64" y="607" class="body">POST /invoice-drafts → extraction handler → ChatClient → model → validated draft → review UI</text><text x="64" y="635" class="body">Do not keep a database transaction open across the slow model call. Saving uses the request above.</text><rect x="42" y="710" width="632" height="205" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="64" y="741" class="label">SUCCESS PATH</text><text x="64" y="778" class="heading">Return an API response record</text><text x="64" y="815" class="body">Map from domain/persistence types to the agreed DTO.</text><text x="64" y="843" class="body">Expose the outcome the UI needs, not the JPA entity.</text><text x="64" y="871" class="body">The UI confirms success and refreshes the relevant data.</text><rect x="710" y="710" width="648" height="205" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="732" y="741" class="label">FAILURE PATH</text><text x="732" y="778" class="heading">Translate once at the correct boundary</text><text x="732" y="815" class="body">Controller / handler exception → shared advice → ProblemDetail.</text><text x="732" y="843" class="body">Security-filter failures use the configured security response path.</text><text x="732" y="871" class="body">UI maps stable problem types to a useful recovery action.</text><rect x="42" y="955" width="1316" height="111" rx="14" fill="#132f55" stroke="#132f55" stroke-width="2"/><text x="64" y="993" class="heading white">VERIFY EACH BOUNDARY</text><text x="64" y="1030" class="body white">HTTP contract · handler rules · database behavior · provider failures · complete browser task</text>
</svg>
