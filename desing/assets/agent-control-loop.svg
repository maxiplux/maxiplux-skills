<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title description">
<title id="title">The model proposes. The application controls execution.</title><desc id="description">Context enters a model decision. An answer exits the loop. A requested tool call passes through argument, authorization, tenant and approval checks before execution. The bounded result returns as an observation. Stop conditions and output validation apply throughout.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#132f55}.title{font-size:36px;font-weight:750}.heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.label{font-size:16px;font-weight:700;letter-spacing:1.1px}.white{fill:#ffffff}.mono{font-family:Consolas,monospace;font-size:20px}.note{font-size:20px;font-weight:600}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#245bd6"/></marker></defs>
<rect x="0" y="0" width="1400" height="1060" rx="22" fill="#f8fbff" stroke="#c2d3ed" stroke-width="2"/><text x="42" y="62" class="title">The model proposes. The application controls execution.</text><text x="42" y="104" class="body">Example: investigate an unpaid invoice, then prepare a reminder for review.</text><rect x="42" y="142" width="1316" height="127" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="64" y="176" class="label">CONTEXT FOR THIS REQUEST</text><text x="64" y="213" class="body">User goal + approved instructions + allowed tool schemas + relevant business data</text><text x="64" y="241" class="body">Optional: retrieved policy documents and scoped conversation memory. External text remains data.</text><path d="M525 270 V322" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="338" width="260" height="235" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="64" y="369" class="label">1 · GOAL</text><text x="64" y="406" class="heading">Investigate</text><text x="64" y="443" class="body">Invoice INV-104</text><text x="64" y="471" class="body">Why is it unpaid?</text><text x="64" y="499" class="body">Who is asking?</text><text x="64" y="527" class="body">Which tenant?</text><rect x="338" y="338" width="336" height="235" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="360" y="369" class="label">2 · MODEL DECISION</text><text x="360" y="406" class="heading">Answer or request</text><text x="360" y="443" class="body">Tool: getPayments</text><text x="360" y="471" class="body">Argument: invoiceId</text><text x="360" y="499" class="body">Or return an answer</text><text x="360" y="527" class="body">with supporting evidence</text><rect x="710" y="338" width="306" height="235" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="732" y="369" class="label">3 · APPLICATION GATE</text><text x="732" y="406" class="heading">Check the request</text><text x="732" y="443" class="body">Validate arguments</text><text x="732" y="471" class="body">Authorize + scope data</text><text x="732" y="499" class="body">Enforce allowed tools</text><text x="732" y="527" class="body">Require approval if needed</text><rect x="1052" y="338" width="306" height="235" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="1074" y="369" class="label">4 · TOOL EXECUTION</text><text x="1074" y="406" class="heading">Run bounded work</text><text x="1074" y="443" class="body">Call application service</text><text x="1074" y="471" class="body">Apply timeout / limits</text><text x="1074" y="499" class="body">Return data or typed error</text><text x="1074" y="527" class="body">Record the outcome</text><path d="M303 450 H326" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M675 450 H698" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M1017 450 H1040" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="641" width="632" height="169" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="64" y="681" class="label">ANSWER PATH</text><text x="64" y="720" class="body">Validate the result → answer or editable draft.</text><text x="64" y="748" class="body">If evidence is missing, ask or explain the limitation.</text><text x="64" y="776" class="body">A reminder draft does not authorize sending it.</text><path d="M505 574 V629" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="611" class="small">answer</text><rect x="710" y="641" width="648" height="169" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="732" y="681" class="label">5 · OBSERVE</text><text x="732" y="720" class="body">Read the tool result, including failures.</text><text x="732" y="748" class="body">Continue only if another allowed step helps the goal.</text><text x="732" y="776" class="body">Feed the observation back into the next model call.</text><path d="M1205 574 V629" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><path d="M840 641 V607 H650 V585" fill="none" stroke="#245bd6" stroke-width="3" marker-end="url(#arrow)"/><text x="727" y="600" class="small">tool result → next decision</text><rect x="42" y="855" width="1316" height="159" rx="14" fill="#132f55" stroke="#132f55" stroke-width="2"/><text x="64" y="894" class="heading white">STOP CONDITIONS ARE APPLICATION BEHAVIOR</text><text x="64" y="932" class="body white">Goal reached · more user input needed · cancellation · approval denied · unrecoverable error</text><text x="64" y="960" class="body white">Step / time / usage limit reached → return a clear outcome instead of continuing indefinitely.</text>
</svg>
