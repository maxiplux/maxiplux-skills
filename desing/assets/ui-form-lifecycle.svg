<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title description">
<title id="title">A form is a conversation, not a collection of inputs.</title><desc id="description">A worked invoice form with persistent labels, required fields, an inline error, preserved customer value and a focus indicator. Six lifecycle states cover editing, checking, saving, success, failure and uncertain write results. Server validation remains authoritative.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#132f55}.title{font-size:36px;font-weight:750}.heading{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.label{font-size:16px;font-weight:700;letter-spacing:1.1px}.white{fill:#ffffff}.mono{font-family:Consolas,monospace;font-size:20px}.note{font-size:20px;font-weight:600}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#245bd6"/></marker></defs>
<rect x="0" y="0" width="1400" height="1050" rx="22" fill="#f8fbff" stroke="#c2d3ed" stroke-width="2"/><text x="42" y="62" class="title">A form is a conversation, not a collection of inputs.</text><text x="42" y="104" class="body">Example: creating an invoice. Read the details above the state flow before shipping the form.</text><rect x="42" y="142" width="625" height="530" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="68" y="185" class="heading">Create invoice</text><text x="68" y="220" class="small">Fields marked * are required. Amounts are in USD.</text><text x="68" y="268" class="note">Customer *</text><rect x="68" y="282" width="570" height="57" rx="14" fill="#f8fbff" stroke="#c2d3ed" stroke-width="2"/><text x="88" y="318" class="body">Acme Ltd</text><text x="68" y="380" class="note">Amount (USD) *</text><rect x="64" y="392" width="578" height="65" rx="14" fill="#f8fbff" stroke="#245bd6" stroke-width="2"/><rect x="69" y="397" width="568" height="55" rx="10" fill="#ffffff" stroke="#8b3524" stroke-width="2"/><text x="88" y="431" class="body">0.00</text><text x="68" y="489" class="note">Enter an amount greater than zero.</text><text x="68" y="520" class="small">The message is associated with the field.</text><rect x="68" y="555" width="210" height="61" rx="10" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text x="92" y="594" class="body white">Create invoice</text><text x="305" y="579" class="small">Specific action label</text><text x="305" y="606" class="small">Keep other values intact</text><rect x="706" y="142" width="652" height="250" rx="14" fill="#e7f0ff" stroke="#245bd6" stroke-width="2"/><text x="728" y="173" class="label">BEFORE &amp; DURING INPUT</text><text x="728" y="210" class="heading">Make the requirements clear</text><text x="728" y="247" class="body">Use persistent labels, required indicators and units.</text><text x="728" y="275" class="body">Use an appropriate input type and keyboard.</text><text x="728" y="303" class="body">Allow paste, correction and ordinary navigation.</text><text x="728" y="331" class="body">Do not rely on a placeholder or color alone.</text><rect x="706" y="416" width="652" height="256" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="728" y="447" class="label">WHEN THE PERSON SUBMITS</text><text x="728" y="484" class="heading">Help them finish or recover</text><text x="728" y="521" class="body">Identify errors and help focus the first correction.</text><text x="728" y="549" class="body">Show progress; avoid duplicate submissions.</text><text x="728" y="577" class="body">Keep recoverable input after a failure.</text><text x="728" y="605" class="body">Explain the outcome and the next useful action.</text><text x="42" y="724" class="label">EDIT → CHECK → SAVE · THEN ONE OUTCOME: SUCCESS, FAILURE OR UNKNOWN</text><rect x="42" y="749" width="206" height="144" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="58" y="781" class="label">1 · EDIT</text><text x="58" y="820" class="small">Enter values</text><text x="58" y="857" class="small">Labels + help</text><rect x="264" y="749" width="206" height="144" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="280" y="781" class="label">2 · CHECK</text><text x="280" y="820" class="small">Fix fields</text><text x="280" y="857" class="small">Keep input</text><rect x="486" y="749" width="206" height="144" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="502" y="781" class="label">3 · SAVE</text><text x="502" y="820" class="small">Request pending</text><text x="502" y="857" class="small">Show progress</text><rect x="708" y="749" width="206" height="144" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="724" y="781" class="label">4 · SUCCESS</text><text x="724" y="820" class="small">Invoice created</text><text x="724" y="857" class="small">Confirm outcome</text><rect x="930" y="749" width="206" height="144" rx="14" fill="#ffffff" stroke="#c2d3ed" stroke-width="2"/><text x="946" y="781" class="label">5 · FAILURE</text><text x="946" y="820" class="small">Recover safely</text><text x="946" y="857" class="small">Explain next step</text><rect x="1152" y="749" width="206" height="144" rx="14" fill="#e7f0ff" stroke="#c2d3ed" stroke-width="2"/><text x="1168" y="781" class="label">6 · UNKNOWN</text><text x="1168" y="820" class="small">Write timed out</text><text x="1168" y="857" class="small">Check before retry</text><rect x="42" y="925" width="1316" height="83" rx="14" fill="#132f55" stroke="#132f55" stroke-width="2"/><text x="65" y="959" class="heading white">Client checks improve feedback. Server validation enforces the business rules.</text><text x="65" y="990" class="small white">These are distinct outcomes; a timeout does not prove that a write failed.</text>
</svg>
