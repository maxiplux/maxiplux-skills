name: Publish handbook

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'desing/**'
      - 'spring-boot-ai/**'
      - 'spring-boot-vsa/**'
      - 'angular-vertical-slice/**'
      - 'install.ps1'
      - 'install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desing/handbook/package-lock.json
      - name: Install renderer dependencies
        run: npm ci
        working-directory: desing/handbook
      - name: Build and check handbook
        run: npm run build:pages
        working-directory: desing/handbook
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private || vars.PRIVATE_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
